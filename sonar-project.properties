sonar.organization=durable-workflow
sonar.projectKey=durable-workflow_workflow
sonar.projectName=workflow
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
# Qualification runners are executable test fixtures. Other example application code stays source.
sonar.test.inclusions=tests/**,**/tests/**,**/*.test.*,**/*.spec.*,**/test_*.py,benchmarks/**,scripts/conformance/**,workbench/**,.github/tracing-http/**,.github/queue-contention/**,examples/embedded-http/qualification/**,resources/qualification/**
# Dependencies, generated assets and disposable runtime/build output are not source.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/storage/**,**/.venv/**,**/__pycache__/**,**/coverage/**,**/.scannerwork/**,**/.git/**,.sonar-coverage/**,static/vendor/**,public/vendor/**,resources/js/vendor/**
sonar.test.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/.venv/**
# PHPUnit measures src/; the existing main build supplies its unit and MySQL reports.
sonar.php.coverage.reportPaths=.sonar-coverage/coverage.xml,.sonar-coverage/build/feature-coverage/mysql-shard-*-coverage.xml
# Keep other source in static analysis without claiming it was instrumented by PHPUnit.
sonar.coverage.exclusions=.github/**,docs/**,examples/**,resources/**,scripts/**,workbench/**,ecs.php
sonar.sca.enabled=false
