sonar.organization=durable-workflow
sonar.projectKey=durable-workflow_workflow
sonar.projectName=workflow
sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=tests/**,**/tests/**,**/*.test.*,**/*.spec.*,**/test_*.py,benchmarks/**,scripts/conformance/**,workbench/**,.github/tracing-http/**
# Dependencies, generated assets and disposable runtime/build output are not source.
sonar.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/dist/**,**/build/**,**/storage/**,**/.venv/**,**/__pycache__/**,**/coverage/**,**/.scannerwork/**,**/.git/**,static/vendor/**,public/vendor/**,resources/js/vendor/**
sonar.test.exclusions=**/vendor/**,**/node_modules/**,**/target/**,**/.venv/**
# Existing repository test and coverage gates remain required; do not fabricate reports.
sonar.sca.enabled=false
