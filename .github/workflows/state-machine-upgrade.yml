name: State machine upgrade

# Installed upgrade journey for the #1069 state-machine examples: published
# 2.33.0 to this source with MySQL or PostgreSQL and Redis queue workers,
# recovery of runs left mid-flight, schema rollback refusal while their
# compensation scopes are retained, and a package downgrade followed by an
# upgrade. Release tags run the same journey against the published package in
# release-verification.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/migrations/**'
      - 'src/V2/Compensation/**'
      - 'src/V2/StateMachine/**'
      - 'examples/business-state-machines/**'
      - 'examples/configured-state-machines/**'
      - 'examples/provider-state-machines/**'
      - 'scripts/ci/state-machine-upgrade-smoke.sh'
      - 'scripts/ci/state-machine-upgrade/**'
      - 'scripts/ci/upgrade-journey-lib.sh'
      - 'scripts/ci/laravel-embedded-upgrade-matrix.php'
      - 'resources/laravel-embedded-upgrade-contract.json'
      - '.github/workflows/state-machine-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: state-machine-upgrade-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Derive bounded Laravel source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      laravel_source_matrix: ${{ steps.laravel-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Validate the journey script syntax
      run: |
        bash -n scripts/ci/state-machine-upgrade-smoke.sh
        for file in scripts/ci/state-machine-upgrade/*.php; do php -l "$file"; done

    - name: Derive bounded Laravel source qualification
      id: laravel-matrix
      run: |
        matrix="$(php scripts/ci/laravel-embedded-upgrade-matrix.php --scope=source)"
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  state-machine-upgrade-mysql:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} / MySQL state machine upgrade
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.laravel_source_matrix) }}

    services:
      mysql:
        image: mysql
        env:
          MYSQL_ROOT_PASSWORD: password
        options: >-
          --tmpfs /var/lib/mysql:rw,noexec,nosuid,size=1024m
        ports:
        - 3306

      redis:
        image: redis
        ports:
        - 6379

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Disable APT download retries (CVE-2026-109518)
      run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: ${{ matrix.php }}
        extensions: pdo_mysql, pdo_sqlite, redis
        tools: composer

    - name: Run the published 2.33.0 to source state machine journey
      env:
        LARAVEL_VERSION: ${{ matrix.laravel }}
        WORKFLOW_CANDIDATE_PATH: ${{ github.workspace }}
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ job.services.mysql.ports['3306'] }}
        DB_USERNAME: root
        DB_PASSWORD: password
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
      run: scripts/ci/state-machine-upgrade-smoke.sh

  state-machine-upgrade-pgsql:
    name: Laravel 13 / PHP 8.3 / PostgreSQL state machine upgrade
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: password
          POSTGRES_DB: workflow
          POSTGRES_INITDB_ARGS: --no-sync
        ports:
        - 5432

      redis:
        image: redis
        ports:
        - 6379

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Disable APT download retries (CVE-2026-109518)
      run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: '8.3'
        extensions: pdo_pgsql, pdo_sqlite, redis
        tools: composer

    - name: Run the published 2.33.0 to source state machine journey
      env:
        LARAVEL_VERSION: '13.*'
        WORKFLOW_CANDIDATE_PATH: ${{ github.workspace }}
        DB_CONNECTION: pgsql
        DB_HOST: 127.0.0.1
        DB_PORT: ${{ job.services.postgres.ports['5432'] }}
        DB_USERNAME: root
        DB_PASSWORD: password
        REDIS_HOST: 127.0.0.1
        REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
      run: scripts/ci/state-machine-upgrade-smoke.sh
