name: Compensation scope upgrade

# Installed upgrade journey for retained compensation scopes (#1063): published
# 2.28.1 to this source, recovery after origin closure, schema rollback with an
# empty and a populated ledger, and code downgrade. Release tags run the same
# journey against the published package in release-verification.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/migrations/**'
      - 'src/V2/Compensation/**'
      - 'scripts/ci/compensation-scope-upgrade-smoke.sh'
      - 'scripts/ci/upgrade-journey-lib.sh'
      - 'scripts/ci/laravel-embedded-upgrade-matrix.php'
      - 'resources/laravel-embedded-upgrade-contract.json'
      - '.github/workflows/compensation-upgrade.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compensation-upgrade-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: Derive bounded Laravel source qualification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      laravel_source_matrix: ${{ steps.laravel-matrix.outputs.matrix }}
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Validate the journey script syntax
      run: bash -n scripts/ci/compensation-scope-upgrade-smoke.sh

    - name: Derive bounded Laravel source qualification
      id: laravel-matrix
      run: |
        matrix="$(php scripts/ci/laravel-embedded-upgrade-matrix.php --scope=source)"
        printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  compensation-upgrade-source:
    name: Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }} compensation scope upgrade
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.laravel_source_matrix) }}

    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
      with:
        persist-credentials: false

    - name: Disable APT download retries (CVE-2026-109518)
      run: echo 'Acquire::Retries "0";' | sudo tee /etc/apt/apt.conf.d/99-no-retries >/dev/null
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
      with:
        php-version: ${{ matrix.php }}
        tools: composer

    - name: Run the published 2.28.1 to source compensation journey
      env:
        LARAVEL_VERSION: ${{ matrix.laravel }}
        WORKFLOW_CANDIDATE_PATH: ${{ github.workspace }}
      run: scripts/ci/compensation-scope-upgrade-smoke.sh
