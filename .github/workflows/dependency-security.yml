name: dependency-security

on:
  push:
    branches: [main]
    paths:
      - .github/dependabot.yml
      - .github/workflows/dependency-security.yml
      - composer.json
      - resources/laravel-dependency-security-policy.json
      - resources/laravel-embedded-upgrade-contract.json
      - scripts/ci/check-laravel-dependency-security.php
  pull_request:
    branches: [main]
    paths:
      - .github/dependabot.yml
      - .github/workflows/dependency-security.yml
      - composer.json
      - resources/laravel-dependency-security-policy.json
      - resources/laravel-embedded-upgrade-contract.json
      - scripts/ci/check-laravel-dependency-security.php
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  laravel-supported-majors:
    name: Audit every supported Laravel major
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: "8.4"
          tools: composer

      - name: Validate Laravel dependency security policy
        run: php scripts/ci/check-laravel-dependency-security.php --policy-only

      - name: Resolve and audit every supported Laravel major
        run: php scripts/ci/check-laravel-dependency-security.php
