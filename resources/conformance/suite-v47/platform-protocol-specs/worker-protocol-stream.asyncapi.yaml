asyncapi: 2.6.0
id: durable-workflow.v2.worker-protocol-stream
info:
  title: Durable Workflow worker-protocol long-poll stream semantics
  version: "12"
  description: >
    Normative AsyncAPI description of the public worker-protocol stream
    semantics. Durable uses HTTP long-poll request/response rather than a
    broker topic, but the externally observable contract is event-stream
    shaped: workers subscribe by polling, the server leases at most one
    task per successful poll, workers renew the lease with heartbeat
    events, and terminal completion/failure events close the lease.
x-durable-workflow-worker-protocol-negotiation:
  advertised_version_path: worker_protocol.version
  default_advertised_version: "1.19"
  request_header_rule: same_major_and_minor_less_than_or_equal_to_advertised
  accepted_request_versions_by_default: ["1.0", "1.1", "1.2", "1.3", "1.4", "1.5", "1.6", "1.7", "1.8", "1.9", "1.10", "1.11", "1.12", "1.13", "1.14", "1.15", "1.16", "1.17", "1.18", "1.19"]
  response_version: advertised_version
  fail_closed_on: [missing_header, malformed_version, different_major, minor_greater_than_advertised]
x-durable-workflow-catalog-entry: worker_protocol_stream
x-durable-workflow-catalog-schema: durable-workflow.v2.platform-protocol-specs.catalog
x-durable-workflow-catalog-version: 16
x-durable-workflow-evolution-rule: additive_minor_breaking_major
x-durable-workflow-message-streams-contract:
  discovery_path: /cluster/info#/message_streams_contract
  minimum_protocol_version: "1.15"
  worker_capability: message_streams
  completion_fields: [message_stream_cursors, message_stream_waits]
  cursor_advancement: highest_contiguous_consumed_position
  replay_identity: [stream_name, message_id, position]
  payload_envelope:
    field: payload_envelope
    worker_delivery: inline_avro_blob
    persistence: exact_inline_bytes_or_external_storage_reference
  version_gate:
    workers_below_minimum:
      advertise_capability: forbidden
      submit_completion_fields: forbidden
    workers_at_or_above_minimum:
      advertise_capability: allowed
      submit_completion_fields: allowed
    rejection_status: 409
    rejection_reason: message_streams_unavailable
x-durable-workflow-typed-search-attributes-contract:
  minimum_protocol_version: "1.16"
  worker_capability: typed_search_attributes
  canonical_type_names: [string, keyword, keyword_list, int, float, bool, datetime]
  completion_field: commands[].attribute_types
  history:
    event_type: SearchAttributesUpserted
    payload_field: attribute_types
    replay_identity: [sequence, attributes, attribute_types]
    legacy_missing_metadata: unknown_type_identity_compare_value_only
  version_gate:
    rejection_status: 409
    rejection_reason: typed_search_attributes_unavailable
x-durable-workflow-condition-wait-occurrence-identity-contract:
  minimum_protocol_version: "1.17"
  worker_capability: condition_wait_occurrence_identity
  command_type: open_condition_wait
  command_field: condition_wait_occurrence_id
  authored_identity: explicit_deterministic_authored_ordinal
  history:
    lifecycle_event_types: [ConditionWaitOpened, ConditionWaitSatisfied, ConditionWaitTimedOut]
    timeout_event_types: [TimerScheduled, TimerCancelled, TimerFired]
    timeout_event_selector: { timer_kind: condition_timeout }
    payload_field: condition_wait_occurrence_id
    propagation: exact_value_on_every_event_for_one_wait_lifecycle
    replay_identity: [sequence, condition_wait_occurrence_id, condition_key, condition_definition_fingerprint, timeout_seconds]
    physical_reevaluations: reuse_open_occurrence_identity
    adjacent_authored_waits: distinct_occurrence_identity
    legacy_missing_occurrence_id: legacy_condition_wait_without_occurrence_identity
  version_gate:
    workers_below_minimum:
      advertise_capability: forbidden
      submit_occurrence_id: forbidden
    capable_workers:
      submit_occurrence_id: required
    servers_below_minimum:
      reject_before_execution: required
    rejection_status: 400
    rejection_reason: unsupported_protocol_version
x-durable-workflow-portable-worker-affinity-contract:
  minimum_protocol_version: "1.18"
  worker_capabilities: [local_activities, worker_sessions, sticky_execution]
  local_activities:
    command_type: record_local_activity
    runtime_schema:
      $ref: ./local-activity-runtime.schema.json#/$defs/localActivityRuntimeContract
    execution_mode: local
    recorded_terminal_side_effect_on_cold_replay: reuse_without_execution
  worker_sessions:
    runtime_schema:
      $ref: ./worker-sessions-runtime.schema.json#/$defs/workerSessionRuntimeContract
    lifecycle_verbs: [create, heartbeat, close]
    holder_loss: replacement_worker_reacquires_and_rebuilds_process_local_state
  sticky_execution:
    cache_owner: worker_process
    cache_key_fields: [workflow_id, run_id, build_id]
    correctness_fallback: cold_replay
  version_gate:
    workers_below_minimum:
      advertise_capabilities: forbidden
      submit_local_activity_command: forbidden
    workers_at_or_above_minimum:
      advertise_only_implemented_capabilities: required
    servers_below_minimum:
      reject_before_execution: required
    rejection_status: 400
    rejection_reason: unsupported_protocol_version
x-durable-workflow-durable-selection-contract:
  minimum_protocol_version: "1.19"
  worker_capability: durable_selection
  group_mode: select
  group_id_prefix: select-calls
  eligible_command_types: [schedule_activity, start_child_workflow, start_timer, open_signal_wait, open_condition_wait]
  command_metadata_fields: [parallel_group_mode, selection_member_key, selection_member_index, selection_member_base_sequence, selection_member_size, selection_member_kind]
  selection_key_domain: non_empty_string_or_non_negative_integer
  winner_history_event: SelectionResolved
  cancellation_history_event: SelectionOperationCancelled
  cancellation_request_result: void
  cancellation_outcome_authority: SelectionOperationCancelled
  cancellation_member_authority: durable_scheduled_or_open_history
  terminal_before_cancellation: preserve_terminal_result_without_cancellation_marker
  cancellation_replay_without_marker: advance_only_after_committed_noop_boundary
  winner_commit: first_eligible_resolution_under_parent_run_lock
  replay: consume_recorded_winner_independent_of_later_history_order
  non_winner_lifecycle: [continue, await, cancel]
  implicit_cancellation: forbidden
  version_gate:
    workers_below_minimum:
      advertise_capability: forbidden
      submit_selection_metadata: forbidden
    servers_below_minimum:
      reject_before_execution: required
    rejection_status: 400
    rejection_reason: unsupported_protocol_version
x-durable-workflow-object-families:
  - name: worker_poll_stream
    owner_repo: durable-workflow/server
  - name: worker_task_lease
    owner_repo: durable-workflow/server
  - name: worker_task_heartbeat
    owner_repo: durable-workflow/server
defaultContentType: application/json
channels:
  worker.workflow_tasks:
    description: Workflow task long-poll and lease lifecycle.
    subscribe:
      operationId: subscribeWorkflowTaskPoll
      summary: Worker polls until a workflow task is leased, the poll times out, or the worker is draining.
      message:
        oneOf:
          - $ref: "#/components/messages/WorkflowTaskLeased"
          - $ref: "#/components/messages/PollTimedOut"
          - $ref: "#/components/messages/WorkerDraining"
    publish:
      operationId: publishWorkflowTaskLeaseEvent
      summary: Worker renews or closes a workflow-task lease.
      message:
        oneOf:
          - $ref: "#/components/messages/TaskHeartbeat"
          - $ref: "#/components/messages/WorkflowTaskCompleted"
          - $ref: "#/components/messages/TaskFailed"
  worker.activity_tasks:
    description: Activity task long-poll and lease lifecycle.
    subscribe:
      operationId: subscribeActivityTaskPoll
      message:
        oneOf:
          - $ref: "#/components/messages/ActivityTaskLeased"
          - $ref: "#/components/messages/PollTimedOut"
          - $ref: "#/components/messages/WorkerDraining"
    publish:
      operationId: publishActivityTaskLeaseEvent
      message:
        oneOf:
          - $ref: "#/components/messages/TaskHeartbeat"
          - $ref: "#/components/messages/ActivityTaskCompleted"
          - $ref: "#/components/messages/TaskFailed"
  worker.query_tasks:
    description: Ephemeral worker-routed query task lifecycle.
    subscribe:
      operationId: subscribeQueryTaskPoll
      message:
        oneOf:
          - $ref: "#/components/messages/QueryTaskLeased"
          - $ref: "#/components/messages/PollTimedOut"
    publish:
      operationId: publishQueryTaskTerminalEvent
      message:
        oneOf:
          - $ref: "#/components/messages/QueryTaskCompleted"
          - $ref: "#/components/messages/TaskFailed"
components:
  messages:
    WorkflowTaskLeased:
      name: WorkflowTaskLeased
      title: Workflow task leased
      payload:
        $ref: "#/components/schemas/TaskLeased"
    ActivityTaskLeased:
      name: ActivityTaskLeased
      title: Activity task leased
      payload:
        $ref: "#/components/schemas/TaskLeased"
    QueryTaskLeased:
      name: QueryTaskLeased
      title: Query task leased
      payload:
        $ref: "#/components/schemas/TaskLeased"
    PollTimedOut:
      name: PollTimedOut
      title: Poll timed out without a task
      payload:
        $ref: "#/components/schemas/PollTerminal"
    WorkerDraining:
      name: WorkerDraining
      title: Worker is draining and must stop accepting new work
      payload:
        $ref: "#/components/schemas/PollTerminal"
    TaskHeartbeat:
      name: TaskHeartbeat
      title: Worker renewed a task lease
      payload:
        $ref: "#/components/schemas/LeaseEvent"
    WorkflowTaskCompleted:
      name: WorkflowTaskCompleted
      title: Worker completed a workflow task
      payload:
        $ref: "#/components/schemas/WorkflowTaskCompletionEvent"
    ActivityTaskCompleted:
      name: ActivityTaskCompleted
      title: Worker completed an activity task
      payload:
        $ref: "#/components/schemas/LeaseTerminalEvent"
    QueryTaskCompleted:
      name: QueryTaskCompleted
      title: Worker completed a query task
      payload:
        $ref: "#/components/schemas/LeaseTerminalEvent"
    TaskFailed:
      name: TaskFailed
      title: Worker failed a leased task
      payload:
        $ref: "#/components/schemas/LeaseTerminalEvent"
  schemas:
    ProtocolEnvelope:
      type: object
      required: [protocol_version, server_capabilities]
      additionalProperties: true
      properties:
        protocol_version:
          type: string
          const: "1.19"
        server_capabilities:
          type: object
          additionalProperties: true
    TaskLeased:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required: [task, lease]
          properties:
            task:
              type: object
              additionalProperties: true
              required: [task_id]
              properties:
                task_id: { type: string }
                task_type: { type: string, enum: [workflow, activity, query] }
                history:
                  type: array
                  items: { $ref: "#/components/schemas/WorkerHistoryEvent" }
            lease:
              type: object
              additionalProperties: true
              required: [leased_at, lease_expires_at]
              properties:
                leased_at: { type: string, format: date-time }
                lease_expires_at: { type: string, format: date-time }
    PollTerminal:
      allOf:
        - $ref: "#/components/schemas/ProtocolEnvelope"
        - type: object
          required: [task, poll_status]
          properties:
            task: { type: "null" }
            poll_status:
              type: string
              enum: [timeout, empty, draining]
            retry_after_seconds:
              type: [integer, "null"]
              minimum: 0
    LeaseEvent:
      type: object
      required: [worker_id, task_id, event]
      additionalProperties: true
      properties:
        worker_id: { type: string }
        task_id: { type: string }
        event:
          type: string
          enum: [heartbeat]
        progress: true
    LeaseTerminalEvent:
      type: object
      required: [worker_id, task_id, event]
      additionalProperties: true
      properties:
        worker_id: { type: string }
        task_id: { type: string }
        event:
          type: string
          enum: [complete, fail]
        result: true
        failure:
          type: [object, "null"]
          additionalProperties: true
    WorkflowTaskCompletionEvent:
      allOf:
        - $ref: "#/components/schemas/LeaseTerminalEvent"
        - type: object
          properties:
            commands:
              type: array
              items: { $ref: "#/components/schemas/WorkflowCommand" }
            message_stream_cursors:
              type: array
              maxItems: 100
              x-durable-workflow-minimum-protocol-version: "1.15"
              items: { $ref: "#/components/schemas/MessageStreamCursorAdvance" }
            message_stream_waits:
              type: array
              maxItems: 100
              x-durable-workflow-minimum-protocol-version: "1.15"
              items: { $ref: "#/components/schemas/MessageStreamWait" }
    WorkflowCommand:
      type: object
      additionalProperties: true
      required: [type]
      properties:
        type: { type: string }
      allOf:
        - if:
            properties:
              type: { const: open_condition_wait }
            required: [type]
          then:
            properties:
              condition_key: { type: string, minLength: 1 }
              condition_definition_fingerprint: { type: string, minLength: 1 }
              condition_wait_occurrence_id:
                type: string
                minLength: 1
                x-durable-workflow-minimum-protocol-version: "1.17"
                x-durable-workflow-worker-capability: condition_wait_occurrence_identity
              timeout_seconds: { type: integer, minimum: 0 }
        - if:
            properties:
              type: { const: record_local_activity }
            required: [type]
          then:
            required: [activity_type, outcome, attempts]
            x-durable-workflow-minimum-protocol-version: "1.18"
            x-durable-workflow-worker-capability: local_activities
            x-durable-workflow-attempt-sequence: contiguous_one_based
            x-durable-workflow-attempt-count-limit: retry_policy.max_attempts_default_1
            x-durable-workflow-final-attempt-outcome: matches_command_outcome
            x-durable-workflow-final-attempt-non-retryable: matches_command_non_retryable_default_false
            x-durable-workflow-retry-prefix-outcomes: [failed, timed_out]
            properties:
              activity_type: { type: string, minLength: 1 }
              arguments: true
              result: true
              payload_codec: { type: string, minLength: 1 }
              outcome: { type: string, enum: [completed, failed, timed_out, cancelled] }
              message: { type: string, minLength: 1 }
              exception_type: { type: [string, "null"] }
              non_retryable: { type: boolean }
              timeout_kind: { type: string, enum: [start_to_close, schedule_to_close, heartbeat] }
              attempts:
                type: array
                minItems: 1
                maxItems: 100
                x-durable-workflow-max-total-heartbeats: 1000
                items: { $ref: "#/components/schemas/LocalActivityAttemptReport" }
              retry_policy: { $ref: "#/components/schemas/LocalActivityRetryPolicy" }
              start_to_close_timeout: { type: integer, minimum: 1 }
              schedule_to_close_timeout: { type: integer, minimum: 1 }
              heartbeat_timeout: { type: integer, minimum: 1 }
              execution_mode: { type: string, const: local }
            allOf:
              - if:
                  required: [outcome]
                  properties:
                    outcome: { const: completed }
                then:
                  required: [result]
              - if:
                  required: [outcome]
                  properties:
                    outcome: { enum: [failed, timed_out, cancelled] }
                then:
                  required: [message]
              - if:
                  required: [outcome]
                  properties:
                    outcome: { const: timed_out }
                then:
                  required: [timeout_kind]
        - if:
            required: [parallel_group_mode]
            properties:
              parallel_group_mode: { const: select }
          then:
            required: [parallel_group_id, parallel_group_kind, parallel_group_base_sequence, parallel_group_size, parallel_group_index, parallel_group_path, selection_member_key, selection_member_index, selection_member_base_sequence, selection_member_size, selection_member_kind]
            x-durable-workflow-minimum-protocol-version: "1.19"
            x-durable-workflow-worker-capability: durable_selection
            properties:
              type: { enum: [schedule_activity, start_child_workflow, start_timer, open_signal_wait, open_condition_wait] }
              parallel_group_id: { type: string, pattern: "^select-calls:[1-9][0-9]*:[1-9][0-9]*$" }
              parallel_group_kind: { type: string, enum: [activity, child, timer, signal, condition, mixed] }
              parallel_group_mode: { type: string, const: select }
              parallel_group_base_sequence: { type: integer, minimum: 1 }
              parallel_group_size: { type: integer, minimum: 1 }
              parallel_group_index: { type: integer, minimum: 0 }
              parallel_group_path: { type: array, minItems: 1, items: { type: object, additionalProperties: true } }
              selection_member_key: { oneOf: [{ type: integer, minimum: 0 }, { type: string, minLength: 1 }] }
              selection_member_index: { type: integer, minimum: 0 }
              selection_member_base_sequence: { type: integer, minimum: 1 }
              selection_member_size: { type: integer, minimum: 1 }
              selection_member_kind: { type: string, enum: [activity, child, timer, signal, condition, group] }
    LocalActivityRetryPolicy:
      type: object
      additionalProperties: false
      properties:
        max_attempts: { type: integer, minimum: 1, maximum: 100, default: 1 }
        backoff_seconds:
          type: array
          maxItems: 99
          items: { type: integer, minimum: 0 }
        non_retryable_error_types:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1 }
    LocalActivityAttemptReport:
      type: object
      additionalProperties: false
      required: [attempt_number, outcome]
      properties:
        attempt_id: { type: string, minLength: 1, maxLength: 255 }
        attempt_number: { type: integer, minimum: 1, maximum: 100 }
        outcome: { type: string, enum: [completed, failed, timed_out, cancelled] }
        duration_ms: { type: integer, minimum: 0 }
        message: { type: string, minLength: 1 }
        exception_type: { type: string, minLength: 1 }
        non_retryable: { type: boolean }
        timeout_kind: { type: string, enum: [start_to_close, schedule_to_close, heartbeat] }
        retry_reason: { type: string, enum: [failure, timeout, cold_replay] }
        backoff_seconds: { type: integer, minimum: 0 }
        heartbeats:
          type: array
          maxItems: 1000
          x-durable-workflow-order: elapsed_ms_monotonic_non_decreasing
          items: { $ref: "#/components/schemas/LocalActivityHeartbeatReport" }
      allOf:
        - if:
            required: [outcome]
            properties:
              outcome: { enum: [failed, timed_out, cancelled] }
          then:
            required: [message]
        - if:
            required: [outcome]
            properties:
              outcome: { const: timed_out }
          then:
            required: [timeout_kind]
    LocalActivityHeartbeatReport:
      type: object
      additionalProperties: false
      required: [elapsed_ms]
      properties:
        elapsed_ms: { type: integer, minimum: 0 }
        details: { type: object, additionalProperties: true }
    WorkerHistoryEvent:
      type: object
      additionalProperties: true
      properties:
        event_type: { type: string }
        payload: { type: object, additionalProperties: true }
      allOf:
        - if:
            required: [event_type]
            properties:
              event_type:
                enum: [ConditionWaitOpened, ConditionWaitSatisfied, ConditionWaitTimedOut]
          then:
            required: [payload]
            properties:
              payload: { $ref: "#/components/schemas/ConditionWaitHistoryPayload" }
        - if:
            required: [event_type]
            properties:
              event_type: { const: SelectionResolved }
          then:
            required: [payload]
            properties:
              payload: { $ref: "#/components/schemas/SelectionResolvedHistoryPayload" }
        - if:
            required: [event_type]
            properties:
              event_type: { const: SelectionOperationCancelled }
          then:
            required: [payload]
            properties:
              payload: { $ref: "#/components/schemas/SelectionOperationCancelledHistoryPayload" }
    ConditionWaitHistoryPayload:
      type: object
      additionalProperties: true
      required: [sequence, condition_wait_id]
      properties:
        sequence: { type: integer, minimum: 0 }
        condition_wait_id: { type: string, minLength: 1 }
        condition_wait_occurrence_id:
          type: string
          minLength: 1
          x-durable-workflow-minimum-protocol-version: "1.17"
        condition_key: { type: [string, "null"] }
        condition_definition_fingerprint: { type: [string, "null"] }
        timeout_seconds: { type: [integer, "null"], minimum: 0 }
    SelectionResolvedHistoryPayload:
      type: object
      additionalProperties: true
      required: [selection_group_id, selection_group_base_sequence, selection_group_size, member_key, member_index, member_base_sequence, member_size, operation_kind, operation_identity, outcome]
      properties:
        selection_group_id: { type: string, pattern: "^select-calls:[1-9][0-9]*:[1-9][0-9]*$" }
        selection_group_base_sequence: { type: integer, minimum: 1 }
        selection_group_size: { type: integer, minimum: 1 }
        member_key: { oneOf: [{ type: integer, minimum: 0 }, { type: string, minLength: 1 }] }
        member_index: { type: integer, minimum: 0 }
        member_base_sequence: { type: integer, minimum: 1 }
        member_size: { type: integer, minimum: 1 }
        operation_kind: { type: string, enum: [activity, child, timer, signal, condition, group] }
        operation_identity: { type: string, minLength: 1 }
        outcome: { type: string, enum: [completed, failed] }
        resolution_event_id: { type: [string, "null"] }
        resolution_event_type: { type: [string, "null"] }
    SelectionOperationCancelledHistoryPayload:
      type: object
      additionalProperties: true
      required: [selection_group_id, member_key, member_index, member_base_sequence, member_size, operation_kind, operation_identity, cancelled_at]
      properties:
        selection_group_id: { type: string, pattern: "^select-calls:[1-9][0-9]*:[1-9][0-9]*$" }
        member_key: { oneOf: [{ type: integer, minimum: 0 }, { type: string, minLength: 1 }] }
        member_index: { type: integer, minimum: 0 }
        member_base_sequence: { type: integer, minimum: 1 }
        member_size: { type: integer, minimum: 1 }
        operation_kind: { type: string, enum: [activity, child, timer, signal, condition, group] }
        operation_identity: { type: string, minLength: 1 }
        cancelled_at: { type: string, format: date-time }
    MessageStreamCursorAdvance:
      type: object
      additionalProperties: false
      required: [stream_name, through_position]
      properties:
        stream_name: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        through_position: { type: integer, minimum: 0 }
    MessageStreamWait:
      type: object
      additionalProperties: false
      required: [stream_name, after_position]
      properties:
        stream_name: { type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$" }
        after_position: { type: integer, minimum: 0 }
x-durable-workflow-semantics:
  long_poll_timeout: The server may hold a poll request until a task is available or the advertised timeout elapses.
  lease_ownership: Only the worker that owns the active lease may heartbeat, complete, or fail the task.
  task_ordering: Queue routing, build-id rollout, and compatibility filters are evaluated before a task is leased.
  terminal_events: Complete and fail are terminal for a lease. Retrying after a terminal event must be idempotent and return the current terminal outcome.
